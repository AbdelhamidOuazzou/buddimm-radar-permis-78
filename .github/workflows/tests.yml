name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Sans les données (non versionnées), les tests unitaires tournent et les contrôles
      # de cohérence des données sont ignorés (skip). En local, après load_data.py, tout tourne.
      - run: python -m pytest -q -rs
